project: "Cultural loss under partial transmission"
status: "Completed derivation with independent checks; bounded priority uncertainty"
date: "2026-11-02"
source_problem:
  primary: "Wakano, Ohtsuki, Kobayashi & Baake (2026), Evolving genealogies in cultural evolution, the descendant process, and the number of cultural traits"
  doi: "10.1016/j.tpb.2025.12.003"
  full_text: "https://arxiv.org/html/2505.08677v2"
  exact_scope: "Section 4 considers independent per-trait transmission probability b<1 at contact rate s/b, preserving the marginal per-trait transmission rate; it reports simulations of the resulting genealogy/repertoire decoupling."
model:
  population: "N labelled sites, independent death/replacement at rate u>0 per site; newborns have no traits"
  innovation: "Independent rate mu>0 Poisson innovations per site; every innovation has a unique identity"
  encounters: "Each ordered distinct parent/learner pair encounters at rate beta/(b*N); self arrows have no effect"
  transmission: "At each encounter every trait of the parent is copied independently with probability b, independently of all other traits and encounters; existing learner traits are retained"
  comparison: "Hold N,u,mu and beta=s*b fixed; vary b in (0,1]"
  observable: "C_b(G): number of distinct traits in the union of a nonempty fixed sample G at a stationary time"
claims:
  known_baseline: "One-trait carrier process and expected popularity spectrum depend on beta but not separately on s and b. This is not claimed as new."
  conditional_law: "Conditional on common death and encounter history H_b, C_b is Poisson(mu*W_b), where W_b is integrated per-innovation probability of transmission to the sample, equivalently conditional mean total ancestral length after independent b-thinning of encounters."
  comparison_theorem: "For 0<b1<b2<=1, W_b1 <=cx W_b2 and C_b1 <=cx C_b2; the expected counts are equal."
  risk_corollaries: "Variance (when finite), all expected count shortfalls E[(k-C_b)_+], and P(C_b=0) are nondecreasing in b. Arbitrary threshold probabilities are NOT ordered by convex order."
  strictness_proved: "Under complete mixing, N>=2, beta>0, mu>0 and nonempty sample, variance and P(C_b=0) are strictly increasing in b. Proved by a positive-probability isolated-arrow witness and independently reviewed."
  computation: "Exact second factorial moments use two independent trait-specific thinnings of the same encounter/death history, lumped by counts of sites in neither/first-only/second-only/both ancestral sets."
  boundary: "The model has no empirical fit. Ordering covers stationary counts and empty-initial finite horizons. For the full population only, regeneration orders complete-empty episode frequency, mean positive-excursion length and excursion Laplace transforms. It does not order arbitrary-threshold hazards or arbitrary initial repertoires. Encounter frequency changes with b."
proof_fingerprint:
  - "Poisson marking / thinning and Cox (mixed Poisson) repertoire law"
  - "Contact superposition: X rate beta, noisy master graph G_b=X+Poisson(beta*(1/b-1)), conditional X|G_b is b-thinning"
  - "For b1<b2, G_b1=G_b2+independent extra arrows; conditional expectations form a martingale coupling, implying convex order by Jensen"
  - "Two-replica integrated reward equation: -Q m12 = r1*m2+r2*m1"
aliases_to_search:
  - "cultural evolution partial transmission / cultural trait bundles / correlated copying / repertoire collapse"
  - "infinite genes horizontal gene transfer / joint ancestral gene transfer graphs"
  - "Poisson thinning convex order / comparison of experiments / conditional expectation / common shocks"
  - "contact process two replicas shared graphical construction / variance / neutral traits"
  - "sequential accumulation independent cultural traits Gaussian limit popularity spectrum 2026"
exact_instances_required:
  - "N=1: no effective social contacts, W~Exp(u), C geometric with mean mu/u, b irrelevant"
  - "beta=0: sample of n independent sites, W~Gamma(n,u), C negative binomial, b irrelevant"
  - "b=1: recover Wakano2026 mixed Poisson genealogy and moment equations"
  - "N=2 exact rational solution, at least two sample sizes and several rational b values"
novelty_verdict: "Conditional proceed: model-specific fixed-rate convex ordering, strictness, identification and regenerative consequences survive the retrieved-source screen; standard probability tools and replica methods are credited. Kobayashi2018 and Scheie2026 full texts remain unchecked. Priority is not certified."

completed_extensions:
  network: "Any finite directed graph with fixed effective edge rates, positive site reset rates and nonnegative site innovation rates"
  variance_series: "V(b)=V(0)+sum_{k>=1}a_k*b^k with nonnegative coefficients; convexity and endpoint chord bound; credited application of Poisson Mehler/chaos identities"
  temporal: "For full population and alpha=sum(mu_i), complete-empty entry intensity alpha*pi0, mean nonempty excursion (1-pi0)/(alpha*pi0), excursion Laplace transforms increasing in b"
  identification: "Known N, full-population E P1 and E P2 determine mu/u and beta/u; strictly increasing Var C determines b. Ensemble-law statement, not a one-inventory estimator"
small_exact_instances:
  parameters: "N=2, beta=2, u=1, mu=1/2; beta is total effective per-learner rate"
  mean_all_b: "3/2"
  b_zero_limit: "E W2=68/5; Var C=53/20"
  b_quarter: "E W2=14; Var C=11/4"
  b_half: "E W2=29/2; Var C=23/8"
  b_one: "E W2=16; Var C=13/4; P(C=0)=4/11"
validation_status: "Root and independent implementations, labelled and lumped generators, rational elimination, boundary recursions, and independent regenerative typed-forward simulation agree"
